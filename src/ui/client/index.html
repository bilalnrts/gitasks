<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="gitasks-csrf" content="__GITASKS_CSRF_TOKEN__">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f2ea">
  <title>Gitasks workspace</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Gitasks navigation">
      <header class="sidebar-header">
        <a class="brand" href="/overview" data-route>
          <span class="brand-mark" aria-hidden="true">G</span>
          <span><strong>Gitasks</strong><small>Issue workspace</small></span>
        </a>
        <button id="sidebar-close" class="icon-button" type="button" aria-label="Close navigation" hidden>Close</button>
      </header>
      <nav class="primary-nav" aria-label="Primary">
        <a href="/overview" data-route><span aria-hidden="true">◫</span>Overview</a>
        <a href="/tasks" data-route><span aria-hidden="true">✓</span>Tasks</a>
        <a href="/activity" data-route><span aria-hidden="true">↻</span>Activity</a>
        <a href="/pull-requests" data-route><span aria-hidden="true">⑂</span>Pull Requests</a>
        <a href="/milestones" data-route><span aria-hidden="true">◇</span>Milestones</a>
      </nav>
      <footer class="sidebar-footer">
        <p class="eyebrow">Repository</p>
        <strong id="repository-name">Loading repository…</strong>
        <a id="repository-link" class="text-link" target="_blank" rel="noreferrer" hidden>Open on GitHub ↗</a>
        <span id="app-version">v0.4.0</span>
      </footer>
    </aside>
    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" hidden></button>
    <div id="workspace" class="workspace">
      <header class="mobile-header">
        <button id="sidebar-toggle" class="button secondary" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
        <a class="mobile-brand" href="/overview" data-route>Gitasks</a>
        <span class="mobile-repo" aria-hidden="true">Workspace</span>
      </header>
      <main id="main-content" tabindex="-1">
        <div id="view-root" aria-live="off">
          <section class="state-panel state-loading" aria-busy="true">
            <strong>Opening Gitasks</strong>
            <p>Reading repository context…</p>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-region" class="toast-region" aria-label="Notifications"></div>
  <p id="announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
</body>
</html>
