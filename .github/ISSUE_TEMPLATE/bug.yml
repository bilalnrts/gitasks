name: Bug report
description: Report reproducible incorrect behavior in Gitasks
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. For security vulnerabilities, stop and follow SECURITY.md instead of submitting this public form. Sanitize all examples: do not include credentials, private repository content, personal data, screenshots, prompts, or model responses.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for the same problem.
          required: true
        - label: This report does not disclose a security vulnerability or sensitive data.
          required: true
  - type: input
    id: version
    attributes:
      label: Gitasks version
      description: Run `gitasks --version`.
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Provide the operating system plus `node --version` and `gh --version`.
      placeholder: Windows 11; Node 20.x; gh 2.x
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Overview
        - Tasks
        - Activity
        - Pull Requests
        - Milestones
        - Build or package
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use sanitized values and list the exact commands or interactions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste only sanitized error text. Do not paste tokens or repository/user content.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Relevant GitHub permissions or repository settings
      description: State whether the operation was read-only or a mutation and whether branch or organization rules apply. Do not paste credentials.
